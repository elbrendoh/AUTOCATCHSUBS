name: Windows JR installer (unsigned)
on:
  workflow_dispatch:
    inputs:
      submit_own_binaries:
        description: 'After SignPath approval: request signing of ONLY our two binaries (not a complete release)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-jr-build.yml'
      - 'tools/**'
      - '.signpath/**'
      - 'requirements-build.txt'
      - 'AUTOCATCHSUBS-release-source/**'
      - 'AUTOCATCHSUBS-backend-source/jr/**'
      - 'AUTOCATCHSUBS-licensing/**'
      - 'AUTOCATCHSUBS-packages/jr/**'
permissions:
  contents: read
concurrency:
  group: windows-jr-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    outputs:
      own-artifact-id: ${{ steps.upload-own.outputs.artifact-id }}
      version: ${{ steps.prepare-own.outputs.version }}
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
        working-directory: X:\s
    env:
      CARGO_TARGET_DIR: X:\t
      RUSTUP_TOOLCHAIN: '1.99.0'
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: s
      - name: Short build path
        working-directory: ${{ github.workspace }}
        run: |
          if(Test-Path X:\){throw 'X: already exists; refusing to replace it'}
          subst X: "$env:GITHUB_WORKSPACE"
          if($LASTEXITCODE -ne 0){throw 'Could not create build path'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Verify sources and install Python build dependencies
        run: |
          python tools/verify-source.py
          if($LASTEXITCODE -ne 0){throw 'Source checks failed'}
          python -m pip install -r requirements-build.txt
          if($LASTEXITCODE -ne 0){throw 'Python dependencies failed'}
          python -m pip freeze > AUTOCATCHSUBS-python-environment.txt
          python tools/test-runtime.py
          if($LASTEXITCODE -ne 0){throw 'Runtime regression tests failed'}
          node tools/build-ui.cjs
          if($LASTEXITCODE -ne 0){throw 'Frontend reconstruction failed'}
          rustup toolchain install 1.99.0 --profile minimal
          if($LASTEXITCODE -ne 0){throw 'Rust toolchain failed'}
      - name: Verified Windows dependencies
        run: ./tools/bootstrap-windows.ps1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/t
          key: windows-jr-rust199-vulkan1363-${{ hashFiles('s/AUTOCATCHSUBS-release-source/Cargo.lock', 's/AUTOCATCHSUBS-release-source/**/*.rs', 's/AUTOCATCHSUBS-release-source/tauri*.json') }}
          restore-keys: windows-jr-rust199-vulkan1363-
      - name: Compile JR client from public sources
        run: ./tools/build-native.ps1 -Edition jr
      - name: Freeze Python backend and assemble
        run: |
          python AUTOCATCHSUBS-licensing/build_backend.py jr
          if($LASTEXITCODE -ne 0){throw 'Python backend build failed'}
          python tools/assemble-ci.py
          if($LASTEXITCODE -ne 0){throw 'Package assembly failed'}
      - name: Dependency and signature inventory
        run: |
          Push-Location ./AUTOCATCHSUBS-release-source
          try {
            cargo metadata --locked --format-version 1 > ../AUTOCATCHSUBS-build-tools/cargo-metadata.json
            if($LASTEXITCODE -ne 0){throw 'Cargo metadata failed'}
          } finally {Pop-Location}
          $rows=Get-ChildItem ./AUTOCATCHSUBS-packages/jr -Recurse -File | Where-Object Extension -in '.exe','.dll','.pyd' | ForEach-Object {
            $sig=Get-AuthenticodeSignature -LiteralPath $_.FullName
            @{file=$_.FullName.Substring((Resolve-Path ./AUTOCATCHSUBS-packages/jr).Path.Length+1);sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash;signature=$sig.Status.ToString();publisher=$sig.SignerCertificate.Subject}
          }
          $rows | ConvertTo-Json -Depth 4 | Set-Content ./AUTOCATCHSUBS-build-tools/signature-inventory.json
      - name: Prepare project-only signing inputs
        id: prepare-own
        run: ./tools/prepare-signpath.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: upload-own
        with:
          name: SignPath-unsigned-own-${{ github.sha }}
          path: ${{ github.workspace }}/s/AUTOCATCHSUBS-build-tools/signpath-unsigned-own/*
          retention-days: 3
          if-no-files-found: error
      - name: Offline runtime and activation guard checks
        run: |
          python tools/smoke-ci.py
          if($LASTEXITCODE -ne 0){throw 'Runtime checks failed'}
      - name: Compile unsigned installer
        run: |
          & ./AUTOCATCHSUBS-build-tools/Inno/ISCC.exe /Qp /DEdition=jr ./AUTOCATCHSUBS-licensing/installer.iss
          if($LASTEXITCODE -ne 0){throw 'Inno compilation failed'}
      - name: Install and uninstall on clean runner
        run: ./tools/test-installer-ci.ps1
      - name: Candidate metadata
        run: |
          $file=Get-Item ./AUTOCATCHSUBS-installers/AUTOCATCHSUBSJR-Setup.exe
          @{commit=$env:GITHUB_SHA;run=$env:GITHUB_RUN_ID;edition='jr';signed=$false;sha256=(Get-FileHash $file.FullName -Algorithm SHA256).Hash;production_licenses_consumed=0;resolve_timeline_tested=$false;smart_app_control_tested=$false} | ConvertTo-Json | Set-Content ./AUTOCATCHSUBS-installers/build-provenance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AUTOCATCHSUBSJR-unsigned-${{ github.sha }}
          path: ${{ github.workspace }}/s/AUTOCATCHSUBS-installers/*
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Windows-build-reports-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/s/AUTOCATCHSUBS-build-tools/*.json
            ${{ github.workspace }}/s/AUTOCATCHSUBS-build-tools/*.log
            ${{ github.workspace }}/s/AUTOCATCHSUBS-python-environment.txt
          retention-days: 3

  sign-own-binaries:
    # Explicit opt-in only. Disabled until the Foundation approves the project,
    # owner configures the SignPath policy, certificate and protected environment.
    # Never produces or publishes a complete signed installer.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.submit_own_binaries && vars.SIGNPATH_ENABLED == 'true'
    needs: build
    runs-on: windows-2022
    environment: signpath-release
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require approved SignPath configuration
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_CERTIFICATE_THUMBPRINT: ${{ vars.SIGNPATH_CERTIFICATE_THUMBPRINT }}
        run: |
          foreach($name in @('SIGNPATH_API_TOKEN','SIGNPATH_ORGANIZATION_ID','SIGNPATH_PROJECT_SLUG','SIGNPATH_SIGNING_POLICY_SLUG','SIGNPATH_ARTIFACT_CONFIGURATION_SLUG','SIGNPATH_CERTIFICATE_THUMBPRINT')){
            if([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))){throw "Missing SignPath configuration: $name"}
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.build.outputs.own-artifact-id }}
          path: original
          merge-multiple: true
      - name: Submit own binaries for manual SignPath approval
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.own-artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed-own
          parameters: |
            version: ${{ toJSON(needs.build.outputs.version) }}
      - name: Verify trusted publisher and unchanged executable content
        env:
          SIGNPATH_CERTIFICATE_THUMBPRINT: ${{ vars.SIGNPATH_CERTIFICATE_THUMBPRINT }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: ./tools/verify-signpath.ps1 -Original ./original -Returned ./signed-own -Report ./signpath-verification.json -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AUTOCATCHSUBSJR-signed-own-only-${{ github.sha }}
          path: |
            signed-own/*
            signpath-verification.json
          retention-days: 3
          if-no-files-found: error
